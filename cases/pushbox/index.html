<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#131720" />
<title>推箱子</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>" />
<style>
  :root {
    --bg1: #10141c;
    --bg2: #171c26;
    --card: #1b212e;
    --card-edge: #2a3243;
    --text: #e8ecf4;
    --text-dim: #9aa4b8;
    --accent: #e8a13d;
    --accent-2: #5ec26a;
    --danger: #e0605a;
    --floor: #232a38;
    --wall: #4a5164;
    --wall-hi: #5c647a;
    --wall-lo: #394056;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, var(--bg2) 0%, var(--bg1) 70%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    user-select: none;
  }
  #app {
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 30%);
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 16px 20px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  header { text-align: center; }
  header h1 {
    font-size: 26px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), #f4c46a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub { color: var(--text-dim); font-size: 12px; margin-top: 3px; }

  .level-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .level-chip {
    width: 34px; height: 34px;
    border: 1px solid var(--card-edge);
    border-radius: 9px;
    background: #20273a;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .level-chip:hover { transform: translateY(-1px); border-color: var(--accent); }
  .level-chip.current { background: var(--accent); color: #201503; border-color: var(--accent); font-weight: 700; }
  .level-chip.locked { color: #55607a; cursor: not-allowed; background: #171c29; }
  .level-chip.locked:hover { border-color: var(--card-edge); transform: none; }

  #board-wrap { position: relative; }
  #board {
    display: block;
    background: var(--floor);
    border-radius: 10px;
    border: 1px solid var(--card-edge);
    box-shadow: inset 0 0 30px rgba(0,0,0,.35);
    touch-action: none;
  }

  .hud { display: flex; gap: 10px; }
  .stat {
    background: #20273a;
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .stat b { color: var(--text); font-size: 15px; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .btn {
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    background: #20273a;
    color: var(--text);
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(.95); }
  .btn.primary { background: var(--accent); color: #201503; border-color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--card-edge); }

  .tips { color: var(--text-dim); font-size: 12px; text-align: center; line-height: 1.7; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px;
    justify-content: center;
  }
  .dpad button {
    width: 52px; height: 52px;
    border-radius: 14px;
    border: 1px solid var(--card-edge);
    background: #20273a;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    touch-action: none;
  }
  .dpad button:active { background: var(--accent); color: #201503; }
  /* 布局：上排 ◀ ▲ ▶，下排中央 ▼ */
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 1; }
  .dpad .right { grid-column: 3; grid-row: 1; }
  .dpad .down  { grid-column: 2; grid-row: 2; }

  /* 过关浮层 */
  #win {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(16,20,28,.82);
    backdrop-filter: blur(3px);
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  #win.show { opacity: 1; pointer-events: auto; }
  #win .big { font-size: 44px; }
  #win h2 { font-size: 26px; letter-spacing: 2px; }
  #win .stat-line { color: var(--text-dim); font-size: 13px; }
  #win .win-btns { display: flex; gap: 10px; margin-top: 6px; }

  /* 宽屏 + 鼠标时隐藏方向键（用键盘）；窄屏或触屏时显示 */
  @media (pointer: fine) and (min-width: 641px) { .dpad { display: none; } }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>📦 推箱子</h1>
      <div class="sub">把箱子推到所有目标点上</div>
    </header>

    <div class="level-row" id="levelRow"></div>

    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="win">
        <div class="big">🎉</div>
        <h2>过关！</h2>
        <div class="stat-line" id="winStats"></div>
        <div class="win-btns">
          <button class="btn" id="winReplay">重新本关</button>
          <button class="btn primary" id="winNext">下一关</button>
        </div>
      </div>
    </div>

    <div class="hud">
      <div class="stat">步数<b id="moves">0</b></div>
      <div class="stat">推箱<b id="pushes">0</b></div>
    </div>

    <div class="controls">
      <button class="btn" id="undoBtn">↩ 撤销</button>
      <button class="btn" id="restartBtn">⟳ 重来</button>
      <button class="btn" id="prevBtn">‹ 上一关</button>
      <button class="btn" id="nextBtn">下一关 ›</button>
    </div>

    <div class="dpad" id="dpad">
      <button class="left" data-dir="-1,0">◀</button>
      <button class="up" data-dir="0,-1">▲</button>
      <button class="right" data-dir="1,0">▶</button>
      <button class="down" data-dir="0,1">▼</button>
    </div>

    <div class="tips">
      方向键 / WASD 移动 · Z 撤销 · R 重来<br/>
      过关后解锁下一关，进度自动保存
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ========================= 关卡数据（已由 tools/verify-levels.mjs 验证可解） =========================
  const LEVELS = [
    { name: '初识推箱', rows: [
      '#######',
      '#     #',
      '#  .  #',
      '#  $  #',
      '#  @  #',
      '#     #',
      '#######',
    ] },
    { name: '走廊转弯', rows: [
      '########',
      '#      #',
      '# #### #',
      '# #    #',
      '# # ## #',
      '# #  # #',
      '# $  . #',
      '#   @  #',
      '########',
    ] },
    { name: '蛇形走位', rows: [
      '#######',
      '#     #',
      '#  .  #',
      '#  $  #',
      '#  .  #',
      '#  $  #',
      '#  @  #',
      '#     #',
      '#######',
    ] },
    { name: '绕墙而行', rows: [
      '#######',
      '#     #',
      '# .$  #',
      '#  @  #',
      '#     #',
      '# ### #',
      '# .$  #',
      '#     #',
      '#######',
    ] },
    { name: '错位双箱', rows: [
      '########',
      '#      #',
      '# #### #',
      '# #  # #',
      '# # .# #',
      '# # .# #',
      '# # $$ #',
      '# # @  #',
      '# ######',
      '########',
    ] },
    { name: '隔行相望', rows: [
      '#######',
      '#     #',
      '# .$. #',
      '#  @  #',
      '# $.$ #',
      '#     #',
      '#######',
    ] },
    { name: '三线并进', rows: [
      '#########',
      '#       #',
      '# .$.$. #',
      '#   @   #',
      '# .$ $  #',
      '#       #',
      '#########',
    ] },
    { name: '分道扬镳', rows: [
      '#######',
      '#     #',
      '# .$. #',
      '#     #',
      '# $.$ #',
      '#     #',
      '#  @  #',
      '#######',
    ] },
    { name: '三层叠箱', rows: [
      '#######',
      '#     #',
      '#  $  #',
      '#  $  #',
      '#  $  #',
      '#  @  #',
      '# . . #',
      '#  .  #',
      '#######',
    ] },
  ];

  // ========================= 常量与工具 =========================
  const key = (x, y) => x + ',' + y;
  const parseKey = (k) => k.split(',').map(Number);
  const ANIM_MS = 120;
  const WALL = '#', GOAL = '.', BOX = '$', BOX_ON_GOAL = '*', PLAYER = '@', PLAYER_ON_GOAL = '+';
  const PROGRESS_KEY = 'sokoban-unlocked';

  // ========================= 画布 =========================
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardWrap = document.getElementById('board-wrap');
  let tile = 40;
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  // ========================= 游戏状态 =========================
  let levelIndex = 0;          // 0 基
  let maxUnlocked = 1;         // 已解锁的最大关卡（1 基）
  let grid = null;             // { w, h, walls, goals }
  let boxes = new Set();       // 箱子位置集合 "x,y"
  let player = [0, 0];
  let moves = 0;
  let pushes = 0;
  let history = [];            // 快照栈：{ player, boxes, moves, pushes }
  let anim = null;             // 移动动画：{ fromP, toP, fromB, toB, pushed, start }
  let won = false;
  let winShown = false;

  // ========================= DOM =========================
  const movesEl = document.getElementById('moves');
  const pushesEl = document.getElementById('pushes');
  const levelRow = document.getElementById('levelRow');
  const winEl = document.getElementById('win');
  const winStats = document.getElementById('winStats');
  const undoBtn = document.getElementById('undoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const winReplay = document.getElementById('winReplay');
  const winNext = document.getElementById('winNext');

  // ========================= 关卡加载与解析 =========================
  function parseLevel(rows) {
    const walls = new Set(), goals = new Set(), boxes = new Set();
    let p = null;
    const h = rows.length;
    const w = Math.max(...rows.map((r) => r.length));
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const c = (rows[y] && rows[y][x]) || ' ';
        if (c === WALL) walls.add(key(x, y));
        else if (c === GOAL) goals.add(key(x, y));
        else if (c === BOX) boxes.add(key(x, y));
        else if (c === BOX_ON_GOAL) { boxes.add(key(x, y)); goals.add(key(x, y)); }
        else if (c === PLAYER) p = [x, y];
        else if (c === PLAYER_ON_GOAL) { p = [x, y]; goals.add(key(x, y)); }
      }
    }
    return { w, h, walls, goals, boxes, player: p };
  }

  function loadLevel(i) {
    levelIndex = i;
    const lv = LEVELS[i];
    grid = parseLevel(lv.rows);
    boxes = grid.boxes;
    player = grid.player.slice();
    moves = 0;
    pushes = 0;
    history = [];
    anim = null;
    won = false;
    winShown = false;
    winEl.classList.remove('show');
    buildLevelRow();
    renderChips();
    updateHUD();
    layoutCanvas();
  }

  // ========================= 进度存取 =========================
  function saveProgress() {
    try { localStorage.setItem(PROGRESS_KEY, String(maxUnlocked)); } catch (e) { /* 忽略 */ }
  }
  function loadProgress() {
    try {
      const v = parseInt(localStorage.getItem(PROGRESS_KEY), 10);
      if (v > 0 && v <= LEVELS.length) maxUnlocked = v;
    } catch (e) { /* 忽略 */ }
  }

  // ========================= 移动逻辑 =========================
  function isWall(x, y) { return grid.walls.has(key(x, y)); }
  function isBox(x, y) { return boxes.has(key(x, y)); }
  function onGoal(x, y) { return grid.goals.has(key(x, y)); }
  function checkWin() {
    let all = boxes.size > 0;
    for (const k of boxes) { if (!grid.goals.has(k)) { all = false; break; } }
    return all;
  }

  function tryMove(dx, dy) {
    if (won || anim) return;
    const nx = player[0] + dx, ny = player[1] + dy;
    if (isWall(nx, ny)) return;
    if (isBox(nx, ny)) {
      const bx = nx + dx, by = ny + dy;
      if (isWall(bx, by) || isBox(bx, by)) return; // 顶墙或顶箱，不能推
      // 记录快照后推箱
      history.push({ player: player.slice(), boxes: new Set(boxes), moves, pushes });
      const boxKey = key(nx, ny);
      boxes.delete(boxKey);
      boxes.add(key(bx, by));
      anim = { fromP: player.slice(), toP: [nx, ny], fromB: [nx, ny], toB: [bx, by], pushed: true, start: performance.now() };
      player = [nx, ny];
      moves++; pushes++;
      sound('push');
    } else {
      history.push({ player: player.slice(), boxes: new Set(boxes), moves, pushes });
      anim = { fromP: player.slice(), toP: [nx, ny], fromB: null, toB: null, pushed: false, start: performance.now() };
      player = [nx, ny];
      moves++;
      sound('move');
    }
    updateHUD();
    won = checkWin();
    if (won && !winShown) onWin();
  }

  function undo() {
    if (won && winShown) { winEl.classList.remove('show'); winShown = false; }
    if (history.length === 0) return;
    const snap = history.pop();
    player = snap.player;
    boxes = snap.boxes;
    moves = snap.moves;
    pushes = snap.pushes;
    anim = null;
    won = false;
    updateHUD();
  }

  function restart() {
    loadLevel(levelIndex);
  }

  function onWin() {
    winShown = true;
    // 解锁下一关
    if (levelIndex + 2 > maxUnlocked) {
      maxUnlocked = Math.min(levelIndex + 2, LEVELS.length);
      saveProgress();
      renderChips();
    }
    if (levelIndex === LEVELS.length - 1) {
      winEl.querySelector('h2').textContent = '全部通关！';
      winNext.textContent = '再玩一次';
    } else {
      winEl.querySelector('h2').textContent = '过关！';
      winNext.textContent = '下一关';
    }
    winStats.textContent = `共 ${moves} 步 · 推箱 ${pushes} 次`;
    winEl.classList.add('show');
    sound('win');
  }

  // ========================= 界面 =========================
  function updateHUD() {
    movesEl.textContent = moves;
    pushesEl.textContent = pushes;
    undoBtn.disabled = history.length === 0;
  }

  function buildLevelRow() {
    levelRow.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
      const b = document.createElement('button');
      b.className = 'level-chip';
      b.textContent = i + 1;
      b.addEventListener('click', () => { if (i + 1 <= maxUnlocked) loadLevel(i); });
      levelRow.appendChild(b);
    }
  }

  function renderChips() {
    [...levelRow.children].forEach((b, i) => {
      b.className = 'level-chip' + (i === levelIndex ? ' current' : '') + (i + 1 > maxUnlocked ? ' locked' : '');
      b.textContent = i + 1 <= maxUnlocked ? i + 1 : '🔒';
    });
    prevBtn.disabled = levelIndex === 0;
    nextBtn.disabled = levelIndex === LEVELS.length - 1;
  }

  // ========================= 画布尺寸 =========================
  function layoutCanvas() {
    const appEl = document.getElementById('app');
    const availW = (appEl.clientWidth || 400) - 16;
    const availH = Math.max(160, window.innerHeight - 340);
    tile = Math.max(22, Math.min(Math.floor(availW / grid.w), Math.floor(availH / grid.h), 56));
    canvas.width = grid.w * tile * dpr;
    canvas.height = grid.h * tile * dpr;
    canvas.style.width = grid.w * tile + 'px';
    canvas.style.height = grid.h * tile + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ========================= 绘制 =========================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const lerp = (a, b, t) => a + (b - a) * t;

  function drawFloor(x, y) {
    const s = tile;
    ctx.fillStyle = '#232a38';
    ctx.fillRect(x * s, y * s, s, s);
    ctx.fillStyle = '#262e3d';
    ctx.fillRect(x * s, y * s, s, 1);
  }

  function drawGoal(x, y) {
    const s = tile, cx = (x + 0.5) * s, cy = (y + 0.5) * s;
    ctx.fillStyle = 'rgba(232,161,61,.16)';
    roundRect(x * s + 2, y * s + 2, s - 4, s - 4, 6); ctx.fill();
    ctx.strokeStyle = '#e8a13d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.13, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#e8a13d';
    ctx.beginPath();
    ctx.arc(cx, cy, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawWall(x, y) {
    const s = tile, p = 1;
    ctx.fillStyle = '#4a5164';
    ctx.fillRect(x * s + p, y * s + p, s - 2 * p, s - 2 * p);
    // 顶部高光 / 底部阴影，营造立体感
    ctx.fillStyle = '#5c647a';
    ctx.fillRect(x * s + p, y * s + p, s - 2 * p, 3);
    ctx.fillStyle = '#394056';
    ctx.fillRect(x * s + p, y * s + s - p - 3, s - 2 * p, 3);
  }

  function drawBox(x, y, onGoal) {
    const s = tile, pad = s * 0.14, r = s * 0.12;
    const gx = x * s + pad, gy = y * s + pad, gw = s - 2 * pad;
    const main = onGoal ? '#5ec26a' : '#d9a441';
    const dark = onGoal ? '#3f9450' : '#a8781f';
    ctx.fillStyle = dark;
    roundRect(gx, gy + 2, gw, gw, r); ctx.fill(); // 底部投影
    ctx.fillStyle = main;
    roundRect(gx, gy, gw, gw, r); ctx.fill();
    // 边框
    ctx.strokeStyle = dark;
    ctx.lineWidth = Math.max(2, s * 0.06);
    roundRect(gx, gy, gw, gw, r); ctx.stroke();
    // 木纹十字
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(gx + gw * 0.5, gy + 2);
    ctx.lineTo(gx + gw * 0.5, gy + gw - 2);
    ctx.moveTo(gx + 2, gy + gw * 0.5);
    ctx.lineTo(gx + gw - 2, gy + gw * 0.5);
    ctx.stroke();
    if (onGoal) {
      ctx.strokeStyle = '#eaffea';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(gx + gw * 0.5, gy + gw * 0.5, gw * 0.28, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawPlayer(x, y) {
    const s = tile, cx = (x + 0.5) * s, cy = (y + 0.5) * s;
    const r = s * 0.17;
    // 身体
    ctx.fillStyle = '#4cc2ff';
    roundRect(cx - r * 0.75, cy + r * 0.4, r * 1.5, r * 1.6, r * 0.6); ctx.fill();
    // 头
    ctx.fillStyle = '#ffd9a8';
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.6, r * 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#e0a86a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.6, r * 0.95, 0, Math.PI * 2);
    ctx.stroke();
    // 眼睛
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.65, r * 0.18, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.35, cy - r * 0.65, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(now) {
    if (!grid) return;
    const w = grid.w, h = grid.h;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 动画进度
    let pPos = player, bAnim = null;
    if (anim) {
      const t = Math.min(1, (now - anim.start) / ANIM_MS);
      const e = 1 - (1 - t) * (1 - t); // easeOutQuad
      pPos = [lerp(anim.fromP[0], anim.toP[0], e), lerp(anim.fromP[1], anim.toP[1], e)];
      if (anim.pushed) bAnim = [lerp(anim.fromB[0], anim.toB[0], e), lerp(anim.fromB[1], anim.toB[1], e)];
      if (t >= 1) anim = null;
    }

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const k = key(x, y);
        if (grid.walls.has(k)) drawWall(x, y);
        else {
          drawFloor(x, y);
          if (grid.goals.has(k)) drawGoal(x, y);
        }
      }
    }
    for (const k of boxes) {
      const [bx, by] = parseKey(k);
      if (anim && bAnim && bx === anim.toB[0] && by === anim.toB[1]) {
        drawBox(bAnim[0], bAnim[1], onGoal(bx, by));
      } else {
        drawBox(bx, by, onGoal(bx, by));
      }
    }
    drawPlayer(pPos[0], pPos[1]);
  }

  function loop(now) {
    draw(now);
    requestAnimationFrame(loop);
  }

  // ========================= 音效 =========================
  let audioCtx = null;
  function beep(freq, dur, type, gain) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain || 0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 忽略 */ }
  }
  function sound(kind) {
    if (kind === 'move') beep(220, 0.05, 'triangle', 0.04);
    else if (kind === 'push') beep(300, 0.08, 'square', 0.05);
    else if (kind === 'win') {
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.07), i * 120));
    }
  }

  // ========================= 输入 =========================
  const KEYMAP = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };

  window.addEventListener('keydown', (e) => {
    const dir = KEYMAP[e.code];
    if (dir) { e.preventDefault(); tryMove(dir[0], dir[1]); return; }
    if (e.code === 'KeyZ' || e.code === 'Backspace') { e.preventDefault(); undo(); }
    else if (e.code === 'KeyR') { e.preventDefault(); restart(); }
    else if (e.code === 'Enter' && won && winShown) {
      if (levelIndex < LEVELS.length - 1) loadLevel(levelIndex + 1);
      else restart();
    }
  });

  document.querySelectorAll('.dpad button').forEach((b) => {
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const [dx, dy] = b.dataset.dir.split(',').map(Number);
      tryMove(dx, dy);
    });
  });

  undoBtn.addEventListener('click', undo);
  restartBtn.addEventListener('click', restart);
  prevBtn.addEventListener('click', () => { if (levelIndex > 0) loadLevel(levelIndex - 1); });
  nextBtn.addEventListener('click', () => { if (levelIndex < LEVELS.length - 1) loadLevel(levelIndex + 1); });
  winReplay.addEventListener('click', restart);
  winNext.addEventListener('click', () => {
    if (levelIndex < LEVELS.length - 1) loadLevel(levelIndex + 1);
    else restart();
  });

  window.addEventListener('resize', layoutCanvas);

  // ========================= 启动 =========================
  loadProgress();
  loadLevel(Math.min(maxUnlocked - 1, LEVELS.length - 1));
  requestAnimationFrame(loop);

  // 暴露内部接口（供自动化测试 / 调试使用）
  window.__game = {
    LEVELS,
    loadLevel,
    tryMove,
    undo,
    restart,
    finishAnimation: () => { anim = null; },
    redraw: (now) => draw(now || 0),
    state: () => ({
      levelIndex, maxUnlocked, moves, pushes,
      player: player.slice(),
      boxes: new Set(boxes),
      won,
      historyLen: history.length,
    }),
  };
})();
</script>
</body>
</html>
