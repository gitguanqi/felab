<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>案例预览 - 前端实验室</title>
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/iconfont.css" />
    <link rel="stylesheet" href="../assets/css/reset.min.css" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/case.css" />
  </head>
  <body>
    <div id="case-app" class="case-app" data-layout="split">
      <header class="case-header">
        <h1 class="case-title">
          <a class="case-title-link" href="../" aria-label="返回案例首页" title="返回案例首页">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
            <span>案例预览</span>
          </a>
        </h1>
        <div class="case-toolbar">
          <div class="layout-switch" role="group" aria-label="切换布局">
            <button
              class="case-control"
              type="button"
              data-layout-value="code"
              aria-label="仅显示代码"
              aria-pressed="false"
              title="仅显示代码"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 6-6 6 6 6M16 6l6 6-6 6" />
              </svg>
              <span class="case-control-label">代码</span>
            </button>
            <button
              class="case-control"
              type="button"
              data-layout-value="preview"
              aria-label="仅显示预览"
              aria-pressed="false"
              title="仅显示预览"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span class="case-control-label">预览</span>
            </button>
            <button
              class="case-control"
              type="button"
              data-layout-value="split"
              aria-label="同时显示代码和预览"
              aria-pressed="true"
              title="同时显示代码和预览"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M12 4v16" />
              </svg>
              <span class="case-control-label">代码+预览</span>
            </button>
          </div>
          <button
            id="share-button"
            class="share-button"
            type="button"
            aria-label="分享案例"
            title="分享案例"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4" />
            </svg>
            <span class="case-control-label">分享</span>
          </button>
          <button
            class="theme-toggle case-theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="切换到暗黑模式"
            aria-pressed="false"
            title="切换到暗黑模式"
          >
            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
              ></path>
            </svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.8 13.2A8.6 8.6 0 1 1 10.8 3.2a7 7 0 0 0 10 10Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="workspace-panel code-panel" aria-label="案例代码">
          <header class="panel-header">
            <div class="source-tabs" role="tablist" aria-label="代码类型">
              <button
                class="source-tab"
                type="button"
                role="tab"
                data-source-tab="html"
                aria-selected="true"
              >
                HTML
              </button>
              <button
                class="source-tab"
                type="button"
                role="tab"
                data-source-tab="css"
                aria-selected="false"
              >
                CSS
              </button>
              <button
                class="source-tab"
                type="button"
                role="tab"
                data-source-tab="js"
                aria-selected="false"
              >
                JS
              </button>
            </div>
            <span id="source-status" class="source-status" role="status"></span>
          </header>
          <pre id="code-scroll" class="code-scroll" hidden><span
              id="line-numbers"
              class="line-numbers"
              aria-hidden="true"
            ></span><code id="source-code" class="source-code" tabindex="0"></code></pre>
          <div id="source-empty" class="source-empty" role="status">正在读取案例源码...</div>
        </section>

        <section class="workspace-panel preview-panel" aria-label="案例预览">
          <header class="panel-header preview-header">
            <span class="panel-title">实时预览</span>
            <a
              id="open-case-link"
              class="open-case-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              打开原案例
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                />
              </svg>
            </a>
          </header>
          <div id="preview-shell" class="preview-shell">
            <iframe
              id="preview-frame"
              title="案例预览"
              sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"
              referrerpolicy="no-referrer"
            ></iframe>
            <div class="preview-loading" role="status">
              <span class="preview-spinner" aria-hidden="true"></span>
              正在载入案例
            </div>
          </div>
        </section>
      </main>
    </div>

    <section id="case-error" class="case-error" hidden>
      <h1>案例预览不可用</h1>
      <p id="case-error-message"></p>
      <a id="case-home-link" href="../">返回案例列表</a>
    </section>

    <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title">
      <div class="share-dialog-heading">
        <h2 id="share-title">分享案例</h2>
        <button id="share-close" class="dialog-close" type="button" aria-label="关闭分享">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <canvas id="share-qr" class="share-qr" aria-label="案例链接二维码"></canvas>
      <p id="share-url" class="share-url"></p>
      <button id="copy-link" class="copy-link" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="8" width="13" height="13" rx="2" />
          <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
        </svg>
        复制案例链接
      </button>
      <p id="copy-feedback" class="copy-feedback" role="status" hidden></p>
    </dialog>

    <script src="../assets/vendor/qrcode.js"></script>
    <script type="module" src="../assets/js/case.js"></script>
  </body>
</html>
