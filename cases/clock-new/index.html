<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            border-radius: 50%;
            box-shadow:
                0 0 30px rgba(100, 149, 237, 0.3),
                0 0 60px rgba(100, 149, 237, 0.1),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .digital-time {
            font-size: 36px;
            font-weight: 300;
            color: #e0e0e0;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .date-label {
            font-size: 16px;
            color: #888;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <canvas id="clock" width="400" height="400"></canvas>
        <div class="digital-time" id="digitalTime">00:00:00</div>
        <div class="date-label" id="dateLabel">2026年6月14日 星期日</div>
    </div>

    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        const digitalEl = document.getElementById('digitalTime');
        const dateEl = document.getElementById('dateLabel');

        const W = canvas.width;
        const H = canvas.height;
        const cx = W / 2;
        const cy = H / 2;
        const radius = W / 2 - 10;

        function draw() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const millis = now.getMilliseconds();

            // Smooth fractional positions
            const secFrac = seconds + millis / 1000;
            const minFrac = minutes + secFrac / 60;
            const hourFrac = (hours % 12) + minFrac / 60;

            ctx.clearRect(0, 0, W, H);

            // --- Clock face ---
            const rimGrad = ctx.createRadialGradient(cx, cy, radius - 8, cx, cy, radius);
            rimGrad.addColorStop(0, '#2c2c54');
            rimGrad.addColorStop(1, '#1e1e3a');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = rimGrad;
            ctx.fill();

            // Outer ring
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100, 149, 237, 0.6)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Inner ring
            ctx.beginPath();
            ctx.arc(cx, cy, radius - 15, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // --- Hour markers ---
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const isMajor = i % 3 === 0;
                const outerR = radius - 15;
                const innerR = isMajor ? radius - 38 : radius - 22;
                const x1 = cx + Math.cos(angle) * innerR;
                const y1 = cy + Math.sin(angle) * innerR;
                const x2 = cx + Math.cos(angle) * outerR;
                const y2 = cy + Math.sin(angle) * outerR;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.3)';
                ctx.lineWidth = isMajor ? 3 : 1.5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // --- Numbers ---
            ctx.fillStyle = '#e0e0e0';
            ctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const numR = radius - 50;
                const nx = cx + Math.cos(angle) * numR;
                const ny = cy + Math.sin(angle) * numR;
                ctx.fillText(i.toString(), nx, ny);
            }

            // --- Center dot ---
            const dotGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 10);
            dotGrad.addColorStop(0, '#fff');
            dotGrad.addColorStop(0.6, '#6495ed');
            dotGrad.addColorStop(1, 'rgba(100,149,237,0)');
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, Math.PI * 2);
            ctx.fillStyle = dotGrad;
            ctx.fill();

            // --- Hour hand ---
            drawHand(hourFrac * 30, radius * 0.50, 7, 'rgba(255,255,255,0.9)');

            // --- Minute hand ---
            drawHand(minFrac * 6, radius * 0.72, 5, 'rgba(180,200,255,0.85)');

            // --- Second hand ---
            const secAngle = (secFrac * 6 - 90) * Math.PI / 180;
            const secLen = radius * 0.82;
            const sx = cx + Math.cos(secAngle) * secLen;
            const sy = cy + Math.sin(secAngle) * secLen;
            const tailLen = radius * 0.15;
            const tx = cx - Math.cos(secAngle) * tailLen;
            const ty = cy - Math.sin(secAngle) * tailLen;

            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(sx, sy);
            ctx.strokeStyle = '#ff6b6b';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Second hand tip dot
            ctx.beginPath();
            ctx.arc(sx, sy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b6b';
            ctx.fill();

            // --- Shadow overlay ---
            const shadowGrad = ctx.createRadialGradient(cx - 20, cy - 20, radius * 0.3, cx, cy, radius);
            shadowGrad.addColorStop(0, 'rgba(255,255,255,0.04)');
            shadowGrad.addColorStop(0.7, 'rgba(0,0,0,0.1)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = shadowGrad;
            ctx.fill();

            // --- Digital display ---
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            digitalEl.textContent = `${hh}:${mm}:${ss}`;

            // --- Date ---
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const y = now.getFullYear();
            const m = now.getMonth() + 1;
            const d = now.getDate();
            const wd = weekdays[now.getDay()];
            dateEl.textContent = `${y}年${m}月${d}日 ${wd}`;

            requestAnimationFrame(draw);
        }

        function drawHand(angleDeg, length, width, color) {
            const angle = (angleDeg - 90) * Math.PI / 180;
            const x = cx + Math.cos(angle) * length;
            const y = cy + Math.sin(angle) * length;

            // Shadow first
            ctx.beginPath();
            ctx.moveTo(cx + 1, cy + 1);
            ctx.lineTo(x + 1, y + 1);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Main hand
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Start animation
        draw();
    </script>
</body>
</html>
