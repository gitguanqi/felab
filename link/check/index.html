<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <script src="../../assets/js/mourn.js"></script>
    <script src="../../assets/js/theme.js"></script>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>站外链接确认 - 前端实验室</title>
    <link rel="stylesheet" href="../../assets/css/iconfont.css" />
    <link rel="stylesheet" href="../../assets/css/reset.min.css" />
    <link rel="stylesheet" href="../../assets/css/theme.css" />
    <link rel="stylesheet" href="../../assets/css/check.css" />
  </head>
  <body>
    <main class="safe-page">
      <div class="theme-control safe-theme-control" data-theme-control>
        <button
          class="theme-toggle safe-theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="当前主题：跟随系统，打开主题菜单"
          aria-haspopup="menu"
          aria-expanded="false"
          title="当前主题：跟随系统，打开主题菜单"
        >
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
            ></path>
          </svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 13.2A8.6 8.6 0 1 1 10.8 3.2a7 7 0 0 0 10 10Z"></path>
          </svg>
          <svg class="theme-icon-system" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
            <path d="M8 20h8M12 16v4"></path>
          </svg>
        </button>
        <div class="theme-menu" data-theme-menu role="menu" aria-label="主题模式" hidden>
          <button
            class="theme-menu-option"
            type="button"
            role="menuitemradio"
            data-theme-value="light"
            aria-checked="false"
          >
            浅色
          </button>
          <button
            class="theme-menu-option"
            type="button"
            role="menuitemradio"
            data-theme-value="dark"
            aria-checked="false"
          >
            深色
          </button>
          <button
            class="theme-menu-option"
            type="button"
            role="menuitemradio"
            data-theme-value="system"
            aria-checked="true"
          >
            跟随系统
          </button>
        </div>
      </div>
      <a class="safe-brand" href="../../">
        <i class="felab felab-flask" aria-hidden="true"></i>
        前端实验室
      </a>

      <section class="safe-panel" aria-labelledby="safe-title">
        <p class="safe-kicker">EXTERNAL LINK</p>
        <h1 id="safe-title">即将离开本站</h1>
        <p class="safe-description">
          请确认目标域名可信。本站不会自动跳转，也不会在链接中执行任何脚本。
        </p>

        <p id="safe-loading" class="safe-loading" role="status">正在校验链接...</p>

        <div id="safe-content" class="safe-content" hidden>
          <p class="safe-host-label">目标域名</p>
          <p id="target-host" class="safe-host"></p>
          <p class="safe-url-label">完整地址</p>
          <code id="target-url" class="safe-url"></code>
          <div class="safe-actions">
            <button id="continue-button" class="primary-button" type="button" disabled>
              <span>继续</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
            <a id="back-link" class="secondary-button" href="../../">返回实验室</a>
          </div>
        </div>

        <p id="safe-error" class="safe-error" role="alert" hidden></p>
      </section>
    </main>

    <script type="module" src="../../assets/js/check-link.js"></script>
  </body>
</html>
