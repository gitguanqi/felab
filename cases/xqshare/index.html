<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="XqShare 浏览器 UMD 用法示例" />
    <title>小奇分享插件案例</title>
    <link rel="stylesheet" href="./vendor/css/xqshare.min.css" />
    <link rel="stylesheet" href="./share.css" />
  </head>
  <body>
    <main class="share-demo">
      <header class="share-demo-heading">
        <p class="share-demo-kicker">XqShare 0.1.3 / Browser UMD</p>
        <h1>分享这个案例</h1>
      </header>

      <button
        id="openBtn"
        class="share-open"
        type="button"
        aria-controls="shareHost"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"></path>
        </svg>
        打开分享面板
      </button>

      <div id="shareHost"></div>
      <p id="demoStatus" class="demo-status" role="status" aria-live="polite"></p>
    </main>

    <script src="./vendor/js/xqshare.min.js"></script>
    <script src="./share.js"></script>
  </body>
</html>
