<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H5 音视频录制</title>
    <link rel="stylesheet" href="./record.css" />
  </head>
  <body>
    <main class="recording-page">
      <header class="recording-heading">
        <div>
          <p class="recording-kicker">WebRTC / MediaRecorder</p>
          <h1>H5 音视频录制</h1>
        </div>
        <a
          class="recording-standalone"
          href="./"
          target="_blank"
          rel="noopener"
          data-standalone-link
          hidden
        >
          在新窗口打开
        </a>
      </header>

      <section class="recording-panel" data-recorder="audio" aria-labelledby="audio-title">
        <header class="recording-panel-header">
          <div>
            <h2 id="audio-title">音频录制</h2>
            <p class="recording-status" data-status role="status">等待开始</p>
          </div>
          <audio data-output controls preload="metadata"></audio>
        </header>
        <div class="recording-actions">
          <button class="record-button record-button-primary" data-start type="button">
            开始音频
          </button>
          <button class="record-button" data-stop type="button" disabled>结束音频</button>
          <button class="record-button" data-play type="button" disabled>播放音频</button>
        </div>
      </section>

      <section class="recording-panel" data-recorder="video" aria-labelledby="video-title">
        <header class="recording-panel-header">
          <div>
            <h2 id="video-title">视频录制</h2>
            <p class="recording-status" data-status role="status">等待开始</p>
          </div>
          <video data-output controls playsinline preload="metadata"></video>
        </header>
        <div class="recording-actions">
          <button class="record-button record-button-primary" data-start type="button">
            开始视频
          </button>
          <button class="record-button" data-stop type="button" disabled>结束视频</button>
          <button class="record-button" data-play type="button" disabled>播放视频</button>
        </div>
      </section>
    </main>

    <script src="./record.js"></script>
  </body>
</html>
